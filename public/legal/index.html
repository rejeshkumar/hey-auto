<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal — Aye Auto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }
    h1 { color: #f5c800; font-size: 2rem; margin-bottom: 8px; }
    p  { color: #ccc; margin-bottom: 40px; font-size: 0.95rem; }
    .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #ffffff10;
      border: 1px solid #ffffff20;
      border-radius: 12px;
      padding: 32px 40px;
      text-decoration: none;
      color: #fff;
      transition: background 0.2s;
      min-width: 200px;
    }
    .card:hover { background: #ffffff20; }
    .card h2 { font-size: 1.1rem; color: #f5c800; margin-bottom: 6px; }
    .card p  { color: #aaa; font-size: 0.85rem; margin: 0; }
    .footer  { color: #666; font-size: 0.8rem; margin-top: 60px; }
  </style>
</head>
<body>
  <h1>Aye Auto — Legal</h1>
  <p>Navam Works LLP &middot; Taliparamba, Kerala, India</p>
  <div class="cards">
    <a class="card" href="/legal/privacy">
      <h2>Privacy Policy</h2>
      <p>How we collect, store, and use your data</p>
    </a>
    <a class="card" href="/legal/terms">
      <h2>Terms of Service</h2>
      <p>Rules, fares, and responsibilities</p>
    </a>
  </div>
  <div class="footer">&copy; 2026 Navam Works LLP</div>
</body>
</html>
