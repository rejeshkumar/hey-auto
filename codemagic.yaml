workflows:
  rider-android:
    name: Rider App - Android APK
    max_build_duration: 60
    environment:
      java: 17
      node: "20"
    scripts:
      - name: Install dependencies
        script: |
          cd apps/rider-app
          npm install

      - name: Expo prebuild
        script: |
          cd apps/rider-app
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        script: |
          cd apps/rider-app/android
          ./gradlew assembleRelease

    artifacts:
      - apps/rider-app/android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - rejesh@gmail.com
        notify:
          success: true
          failure: true

  rider-ios:
    name: Rider App - iOS IPA
    max_build_duration: 90
    environment:
      xcode: latest
      node: "20"
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: in.heyauto.rider
    scripts:
      - name: Install dependencies
        script: |
          cd apps/rider-app
          npm install

      - name: Expo prebuild
        script: |
          cd apps/rider-app
          npx expo prebuild --platform ios --clean --no-install

      - name: Set code signing
        script: |
          cd apps/rider-app/ios
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd apps/rider-app/ios
          xcodebuild -workspace HeyAuto.xcworkspace \
            -scheme HeyAuto \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/HeyAuto.xcarchive \
            -allowProvisioningUpdates \
            archive | xcpretty
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/HeyAuto.xcarchive \
            -exportOptionsPlist $CM_BUILD_DIR/export_options.plist \
            -exportPath $CM_BUILD_DIR/output | xcpretty

    artifacts:
      - $CM_BUILD_DIR/output/*.ipa

    publishing:
      email:
        recipients:
          - rejesh@gmail.com
        notify:
          success: true
          failure: true

  driver-ios:
    name: Driver App - iOS IPA
    max_build_duration: 90
    environment:
      xcode: latest
      node: "20"
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: in.heyauto.driver
    scripts:
      - name: Install dependencies
        script: |
          cd apps/driver-app
          npm install

      - name: Expo prebuild
        script: |
          cd apps/driver-app
          npx expo prebuild --platform ios --clean --no-install

      - name: Set code signing
        script: |
          cd apps/driver-app/ios
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd apps/driver-app/ios
          echo "=== Available workspaces and schemes ==="
          find . -name "*.xcworkspace" -maxdepth 2
          xcodebuild -list 2>&1 | head -30 || true
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1 | xargs basename)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/,0' | grep -v "Schemes:" | head -1 | xargs)
          echo "Using workspace: [$WORKSPACE]  scheme: [$SCHEME]"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - rejesh@gmail.com
        notify:
          success: true
          failure: true

  driver-android:
    name: Driver App - Android APK
    max_build_duration: 60
    environment:
      java: 17
      node: "20"
    scripts:
      - name: Install dependencies
        script: |
          cd apps/driver-app
          npm install

      - name: Expo prebuild
        script: |
          cd apps/driver-app
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        script: |
          cd apps/driver-app/android
          ./gradlew assembleRelease

    artifacts:
      - apps/driver-app/android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - rejesh@gmail.com
        notify:
          success: true
          failure: true
